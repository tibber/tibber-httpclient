version: 2.1
workflows:
  build_and_deploy:
    jobs:
      - build:
          context:
            - GITHUB
      - publish:
          requires:
            - build
          context:
            - GITHUB
          filters:
            branches:
              only: 4.x
jobs:
  build:
    working_directory: ~/package
    resource_class: small
    docker:
      - image: cimg/node:24.11.0
    steps:
      - checkout
      - run:
          name: Build Package
          command: |
            yarn
            yarn test
            yarn build
      - persist_to_workspace:
          root: .
          paths:
            - .
  publish:
    working_directory: ~/package
    resource_class: small
    docker:
      - image: cimg/node:24.11.0
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Deploy Package
          command: |
            echo "//npm.pkg.github.com/:_authToken=$GITHUB_AUTH_TOKEN" > ~/.npmrc
            NAME=$(node -p "require('./package.json').name")
            V=$(node -p "require('./package.json').version")
            if npm view "$NAME@$V" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
              echo "$NAME@$V already published, skipping"
              exit 0
            fi
            # 4.x is a maintenance line: keep the latest dist-tag on 5.x.
            # (npm rejects dist-tags that parse as semver ranges, like v4.)
            npm publish --tag legacy
